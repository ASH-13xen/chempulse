name: Collect market data

on:
  schedule:
    # Every 3 hours (UTC). GitHub may start scheduled runs a few minutes late.
    - cron: "15 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run every source now, including news (normally every 6 h)"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install collector
        run: pip install -r collector/requirements.txt

      - name: Collect (writes only new or changed prices)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ vars.MONGODB_DB || 'chempulse' }}
          SITE_URL: ${{ vars.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        # MARKET_MINUTES (optional repo variable): minutes per marketplace per run.
        # Unset = full slices (~30 min/run, fine for public repos). Private repos get
        # 2,000 free minutes a month: set it to 1 to stay inside that.
        run: python -m collector.run --sink mongo ${{ inputs.force && '--force' || '' }} ${{ vars.MARKET_MINUTES && format('--budget {0}', vars.MARKET_MINUTES) || '' }}
